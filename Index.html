<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Para mi persona especial</title>
        <style>
            body { margin: 0; padding: 0; background: linear-gradient(135deg, #ffb6c1, #dda0dd); font-family: sans-serif; color: white; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
                h1 { font-size: 2em; animation: fadeIn 3s ease-in-out; }
                    @keyframes fadeIn { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }
                        .flower { position: absolute; width: 30px; height: 30px; background-image: url('https://cdn-icons-png.flaticon.com/512/616/616408.png'); background-size: cover; animation: fall linear infinite; pointer-events: none; }
                            @keyframes fall { from {transform: translateY(-100px) rotate(0deg); opacity:1;} to {transform: translateY(100vh) rotate(360deg); opacity:0;} }
                                audio { position: absolute; bottom: 10px; left: 10px; }
                                  </style>
                                  </head>
                                  <body>
                                    <h1>Buenos días mi luna hermosa ❤️</h1>
                                      <audio autoplay loop>
                                          <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
                                              Tu navegador no soporta audio.
                                                </audio>
                                                  <script>
                                                      function createFlower() {
                                                            const f = document.createElement("div");
                                                                  f.classList.add("flower");
                                                                        f.style.left = Math.random() * 100 + "vw";
                                                                              f.style.animationDuration = (2 + Math.random() * 3) + "s";
                                                                                    document.body.appendChild(f);
                                                                                          setTimeout(() => f.remove(), 5000);
                                                                                              }
                                                                                                  setInterval(createFlower, 300);
                                                                                                    </script>
                                                                                                    </body>
                                                                                                    </html>
